<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 50px;
            height: 50px;
            background-color: pink;
            margin: 100px auto;
            /* 1.必须在一行内显示 */
            white-space: nowrap;
            /* 2.超出的部分隐藏 */
            overflow: hidden;
            /* 3.文字溢出用省略号显示 */
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <div>哈哈哈哈哈哈哈哈哈哈或或或或或</div>
</body>

</html>
