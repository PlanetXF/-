<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise关键问题 - Promise 异常穿透</title>
</head>
<body>
    <script>
        // 异常穿透：在多个链式调用的最后指定错误回调
        let p = new Promise((resolve, reject) => {
            // setTimeout(() => {
                resolve('ok');
                // reject('err');
            // }, 1000);
        })
        p.then(value => {
            // console.log(111);
            // return new Promise((resolve, reject) => {
            //     resolve('ok');
            // });
            return new Promise((resolve, reject) => {
                reject('error')
            });
        }).then(value => {
            throw '也出错了'
            console.log(222);
        }).then(value => {
            console.log(333);
        }).catch(reason => {
            console.log(reason);
        })
    </script>
</body>
</html>
