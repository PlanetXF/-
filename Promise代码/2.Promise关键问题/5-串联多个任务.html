<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise关键问题 - Promise 如何串联多个任务</title>
</head>
<body>
    <script>
        let p = new Promise((resolve, reject) => {
            setTimeout(function() {
                resolve('ok')
            }, 1000);
        });
        p.then(value => {
            return new Promise((resolve, reject) => {
                resolve('success');
            }) 
        }).then(value => { // 这个then的回调是成功，但没有返回值， 所以返回值为 undefined
            console.log(value); // success
        }).then(value => {
            console.log(value); // undefined
        })
    </script>
</body>
</html>
