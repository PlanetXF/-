<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise关键问题 - Promise 中断Promise链 </title>
</head>
<body>
    <script>
        let p = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve('ok');
            }, 1000);
        })
        p.then(value => {
            console.log(111);
            // 中断Promise链有且只有一种方式
            return new Promise(() => {});  // 返回一个 pending 状态的 Promise 对象
            // 原因： pending 状态的对象，状态未改变，所以后面的then不能执行回调
        }).then(value => {
            console.log(222);
        }).then(value => {
            console.log(333);
        }).catch(reason => {
            console.log(reason);
        })
    </script>
</body>
</html>
