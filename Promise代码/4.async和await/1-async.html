    <title>async函数</title>
</head>
<body>
    <script>
        // 1.函数的返回值为Promise对象
        // 2.Promise对象的结果由async函数执行的返回值决定
        async function main() {
            // 1.返回值为非Promise
            return '123'
            // 2.返回的是一个Promise对象
            // return new Promise((resolve, reject) => {
            //     // resolve('ok');
            //     reject('error');
            // });
            // 3.抛出异常
            // throw 'Oh no';
        }
        let result = main();
        console.log(result);
    </script>
</body>
</html>
